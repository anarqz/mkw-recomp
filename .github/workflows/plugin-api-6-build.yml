name: Plugin API 6 (test build)

# A test build of mkwmp/plugin-api-6 (plugin API 6: the in-game menu's settings for a plugin's page, menu_redirect, hacks_lock) for a
# live test on Windows: mkw.exe exactly as release.yml's windows job builds it, kept as a run artifact with the
# overlay example plugin (tools/plugin/overlay_plugin.c) as a .dll, plus the Linux runtime build and the repo's
# checks, so the change is known to compile on both systems. Lives only on ci/plugin-api-6-build, not for upstream.
# The exe replaces the one of an installed 0.1.18, so it must say that version (the start screen sets up again when
# setup-state.json's "port" differs): a local tag on HEAD, never pushed, makes git describe say it.
on:
  push:
    branches: [ci/plugin-api-6-build]
  workflow_dispatch:

permissions:
  contents: read

env:
  VMA_URL: https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.4.0/include/vk_mem_alloc.h
  VMA_SHA256: 8487b7995ad3b263eb73bc5b9a77d71aa69b6bef5d58a715c02d2663afd81f1a
  PORT_TAG: v0.1.18
  GAME_ID: c9bbcb75a9ac9a49   # the installed mkwgame.dll's: the runtime change must keep it

jobs:
  windows:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git ccache ninja cmake binutils uv python 7zip
      - uses: actions/checkout@v7
      - name: ccache in the checkout, kept between runs (build.py compiles through it when installed)
        run: echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-
      - name: Git trusts the checkout; the installed version's tag on HEAD, local only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f "$PORT_TAG" HEAD
          git describe --tags --always --dirty
      - uses: actions/cache@v6
        with:
          path: build/win
          key: windeps-${{ hashFiles('tools/build/windeps.py') }}
      - name: llvm-mingw and the Windows libraries
        run: uv run tools/build/windeps.py
      - name: mkw.exe
        run: uv run tools/build/build.py --target windows --dist --runtime-only
      - name: The game id and the version did not change
        run: |
          test "$(cat build/dist/windows/mkwgame.id)" = "$GAME_ID"
          strings build/dist/windows/mkw.exe | grep -x "${PORT_TAG#v}"
      - name: The overlay example plugin as a Windows .dll
        run: CC="$PWD/build/win/llvm-mingw/bin/x86_64-w64-mingw32-clang" tools/plugin/overlay.sh dll
      - name: Package and checksums
        run: |
          mkdir -p out/mods/overlay-example/plugin
          cp build/dist/windows/mkw.exe build/dist/windows/mkwgame.id out/
          cp build/mods-import/overlay-example/plugin/overlay_plugin.dll out/mods/overlay-example/plugin/
          cp runtime/plugin/mkw_plugin.h out/
          (cd out && sha256sum mkw.exe mods/overlay-example/plugin/overlay_plugin.dll mkw_plugin.h | tee SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: mkw-exe-plugin-api-6
          path: out/
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git ccache clang lld llvm ninja make cmake pkgconf expat binutils uv python
      - uses: actions/checkout@v7
      - name: Git trusts the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: VMA header
        run: |
          mkdir -p scratchpad/vma
          curl -sSfL -o scratchpad/vma/vk_mem_alloc.h "$VMA_URL"
          echo "$VMA_SHA256  scratchpad/vma/vk_mem_alloc.h" | sha256sum -c -
      - uses: actions/cache@v6
        with:
          path: build/sysroot
          key: sysroot-${{ hashFiles('tools/build/sysroot.py') }}
      - name: Steam Runtime sysroot (glibc 2.31)
        run: uv run tools/build/sysroot.py
      - name: Runtime and launcher (no game)
        run: uv run tools/build/build.py --dist --runtime-only --sysroot build/sysroot
      - name: The plugin examples (-Werror)
        run: |
          tools/plugin/overlay.sh
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -fvisibility=hidden -I runtime/plugin tools/plugin/example_plugin.c -o /tmp/example_plugin.so
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC -fvisibility=hidden -I runtime/plugin tools/plugin/probe_plugin.c -o /tmp/probe_plugin.so

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Lint
        run: uv run ruff check tools sm86
      - name: Docs match the repo
        run: uv run tools/docs/check.py
      - name: Every setting has its row
        run: uv run tools/git/cfg_rows.py
      - name: Setup command lines (no game)
        run: uv run pytest tests -q
