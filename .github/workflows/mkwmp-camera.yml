name: MKWMP camera on plugin API v3  # the file and the name stay (the workflow's id); the API is the branch's (4 here)

# Fork only, test builds (never a release): mkw-recomp's main, with its native plugin API version 1, built for Windows
# as its release workflow builds it (mkw.exe, the setup tools, the zip), and MKWMP (github.com/anarqz/mkwmp, branch
# plugin-seat: the options page and its own seat client) laid out as the mod folder mkw-recomp loads: mods/mkwmp/ (plugin/mkwmp.dll + mkwmp.so, the voice
# libraries, mod.json). To try them: unzip the runtime into a folder of its own, set the game up there, copy mkwmp/
# into <game>/mods/ and run `mkw --play --mod mkwmp` (or enable it on the Mods page).
on:
  push:
    branches: [mkwmp-camera]
  workflow_dispatch:
    inputs:
      mkwmp_ref:
        description: MKWMP branch or commit to build
        default: main

permissions:
  contents: read

concurrency:
  group: mkwmp-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  MKWMP_REF: ${{ inputs.mkwmp_ref || 'main' }}

jobs:
  windows:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git ccache ninja cmake binutils uv python 7zip
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # build.py's version comes from git describe
      - name: ccache in the checkout, kept between runs (build.py compiles through it when installed)
        run: echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-v1-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-v1-${{ github.job }}-
      - name: Git trusts the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v6
        with:
          path: build/win
          key: windeps-${{ hashFiles('tools/build/windeps.py') }}
      - uses: actions/cache@v6
        with:
          path: build/dist/dl
          key: dist-dl-windows-${{ hashFiles('tools/build/dist.py') }}
      - name: llvm-mingw and the Windows libraries
        run: uv run tools/build/windeps.py
      - name: mkw.exe
        run: uv run tools/build/build.py --target windows --dist --runtime-only
      - uses: actions/cache@v6
        with:
          path: build/dist/dl/llvm-*
          key: llvm-clang-${{ github.job }}-${{ hashFiles('tools/build/llvm_clang.py') }}
      - name: Setup tools
        run: uv run tools/build/dist.py --target windows
      - name: Zip (a test build of main, named so it is not mistaken for a release)
        run: uv run tools/build/release.py --target windows --version "0.1.14-main.${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: mkw-recomp-windows-main
          path: build/release/*.zip
          retention-days: 14
          if-no-files-found: error

  mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: anarqz/mkwmp
          ref: ${{ env.MKWMP_REF }}
          path: mkwmp
      - uses: actions/checkout@v7
        with:
          path: recomp
          sparse-checkout: runtime/plugin
      - name: Same header as this runtime (fails when MKWMP vendors another version)
        run: cmp recomp/runtime/plugin/mkw_plugin.h mkwmp/native/probe/src/mkw_plugin.h
      - name: Zig 0.15.2
        env:
          ZIG: zig-x86_64-linux-0.15.2
          ZIG_SHA256: 02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$ZIG.tar.xz" "https://ziglang.org/download/0.15.2/$ZIG.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$ZIG.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$ZIG.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$ZIG" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$RUNNER_TEMP/zig-cache" >> "$GITHUB_ENV"
      - name: Voice libraries (Windows .dll, Linux .so)
        run: |
          python3 -I mkwmp/native/voice/fetch.py
          python3 -I mkwmp/native/voice/build.py
          python3 -I mkwmp/native/voice/build.py --target linux
      - name: The plugin (mkwmp.dll, mkwmp.so), its test, and the mod folder
        run: python3 -I mkwmp/native/probe/build_plugin.py --test --package --version "v1-$(git -C mkwmp rev-parse --short HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: mkwmp-mod
          path: mkwmp/native/probe/build/plugin/mod/
          retention-days: 14
          if-no-files-found: error
